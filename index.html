<style>
/* Layout: one-column phone app — sticky header with language switch, courts drawn top-down like a doubles court, fixed bottom tab bar */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --ink:#13201B; --muted:#5A6A63; --line:#D3DCD7; --chip:#E1E9E4;
  --accent:#1C6A4F; --accent-ink:#FFFFFF; --shuttle:#C98F0A; --loss:#B2432E;
  --gold:#C99A06; --silver:#8E989E; --bronze:#A8622E; --court:#2E7859; --court-deep:#256348; --court-line:#F3F7F4; --court-ink:#FFFFFF; --court-chip:rgba(8,30,22,.30);
  --f-display:'Chakra Petch','IBM Plex Sans Thai','IBM Plex Sans JP',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','IBM Plex Sans JP',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16201C; --ink:#E4ECE8; --muted:#94A49D; --line:#283631; --chip:#21302A;
  --accent:#55B78E; --accent-ink:#06120D; --shuttle:#E8B83A; --loss:#E3775F;
  --gold:#E8BE3A; --silver:#B9C2C7; --bronze:#D08A55; --court:#1E5741; --court-deep:#184735; --court-line:#CFE1D8; --court-ink:#F2F7F4; --court-chip:rgba(0,0,0,.32);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16201C; --ink:#E4ECE8; --muted:#94A49D; --line:#283631; --chip:#21302A;
  --accent:#55B78E; --accent-ink:#06120D; --shuttle:#E8B83A; --loss:#E3775F;
  --gold:#E8BE3A; --silver:#B9C2C7; --bronze:#D08A55; --court:#1E5741; --court-deep:#184735; --court-line:#CFE1D8; --court-ink:#F2F7F4; --court-chip:rgba(0,0,0,.32);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--shuttle);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{padding-block:8px;display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.lang button{min-height:32px;padding:2px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.counts{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:13px}
.counts span{background:var(--chip);border-radius:6px;padding:1px 8px;white-space:nowrap}
main .in{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:600}
.hint{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:17px}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.btn{min-height:42px;padding:8px 14px;border-radius:9px;background:var(--chip);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.warn{color:var(--loss);border:1px solid var(--line);background:transparent}
.btn.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 0;min-width:0}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;min-height:38px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mdesc{font-size:13.5px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.num{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:17px}
.num[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.court{background:var(--court);color:var(--court-ink);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px}
.court-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);padding-inline:2px;flex-wrap:wrap}
.court-h b{font-size:16px;font-weight:700;letter-spacing:.03em}
.court-h span{font-size:13px;opacity:.88;font-variant-numeric:tabular-nums}
.field{position:relative;border:2px solid var(--court-line);display:grid;grid-template-columns:1fr 1fr;min-height:132px;background:var(--court-deep)}
.field::before{content:"";position:absolute;left:50%;top:-7px;bottom:-7px;border-left:3px dotted var(--court-line);transform:translateX(-50%);z-index:1}
.half{position:relative;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.half::before{content:"";position:absolute;top:0;bottom:0;border-left:1.5px solid var(--court-line);opacity:.55}
.half::after{content:"";position:absolute;top:50%;border-top:1.5px solid var(--court-line);opacity:.55}
.half.l::before{right:26%}.half.l::after{left:0;right:26%}
.half.r::before{left:26%}.half.r::after{right:0;left:26%}
.pc{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--court-chip);color:var(--court-ink);border-radius:7px;padding:7px 8px;min-height:40px;text-align:left;width:100%;border:2px solid transparent}
.pc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc.sel{border-color:var(--shuttle)}
.lvb{flex:0 0 auto;font-family:var(--f-display);font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--ink);white-space:nowrap}
.pc .lvb{background:var(--court-line);color:var(--court-deep)}
.empty-f{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;z-index:2;padding:16px;background:var(--court-deep)}
.empty-f p{margin:0;font-family:var(--f-display);font-size:15px;opacity:.9}
.cbtn{min-height:42px;border-radius:9px;padding:8px 10px;font-weight:600;background:var(--court-line);color:var(--court-deep)}
.cbtn.alt{background:var(--court-chip);color:var(--court-ink);font-weight:500}
.cbtn.armed{background:var(--loss);color:#fff}
.wins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctools .cbtn{flex:1 1 auto}
.stepper{display:flex;align-items:center;gap:2px;background:var(--court-chip);border-radius:9px;padding:2px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:38px;color:var(--court-ink);font-size:18px}
.stepper span{min-width:70px;text-align:center;font-size:13px}
.streak{font-size:12px;background:var(--shuttle);color:#1b1404;border-radius:5px;padding:0 6px;font-weight:600}
.q{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.qn{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.qm{min-width:0}.qm b{font-weight:600}
.sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.next{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.next .vs{font-family:var(--f-display);font-weight:600}
.banner{background:var(--surface);border:1px solid var(--shuttle);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner p{margin:0;font-size:14px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:44px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);text-align:left}
.pick span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.lvchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.lvc{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:12.5px;padding:0 2px}
.lvc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{min-height:38px;padding:4px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=number],input[type=search],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qa{display:flex;flex-direction:column;gap:6px}
.qa .qt{font-weight:600;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{text-align:left;min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:600}
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:10px;padding:10px 12px}
.result .big{font-size:26px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptop b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font-size:12px;font-weight:600;color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td.up{color:var(--accent)} td.dn{color:var(--loss)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--chip);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.hl{background:color-mix(in srgb,var(--shuttle) 22%,var(--surface))}
.big{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.led{display:flex;flex-direction:column;gap:8px}
.ledi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.ledi .lt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ledi .lt b{font-family:var(--f-display)}
.hist{display:flex;flex-direction:column;gap:6px}
.hi{font-size:13.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.hi .w{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--shuttle)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr)}
.scb{display:flex;flex-direction:column;gap:6px}
.scr{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-family:var(--f-display);font-size:14px}
.scr input{background:var(--court-line);color:var(--court-deep);border:0;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:700;min-height:44px;padding:4px}
.qrbox{background:#fff;padding:12px;border-radius:12px;display:inline-block;line-height:0;align-self:center}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sync{background:var(--shuttle);color:#1b1404;font-size:13px;font-weight:600;padding:4px 0;text-align:center}
.kiosk .pick{min-height:56px;font-size:16px}
.evc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rs{display:flex;flex-wrap:wrap;gap:6px}
.rsc{min-height:36px;padding:4px 10px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.rsc.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rsc.n{text-decoration:line-through;color:var(--muted);background:var(--chip)}
.viewer .adm,.viewer .wins,.viewer .ctools,.viewer .scb,.viewer .empty-f .cbtn{display:none!important}
.viewer .pc{pointer-events:none}
.recap img{width:100%;border-radius:10px;display:block}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .pn{font-weight:600;font-size:14.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ps{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff}
.pod.g .step{height:96px;background:var(--gold)}.pod.s .step{height:70px;background:var(--silver)}.pod.b .step{height:52px;background:var(--bronze)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.medal.g{background:var(--gold)}.medal.s{background:var(--silver)}.medal.b{background:var(--bronze)}
.mtally{display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.mtally i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:2px;vertical-align:-1px}
.mtally .g i{background:var(--gold)}.mtally .s i{background:var(--silver)}.mtally .b i{background:var(--bronze)}
td.rk{font-family:var(--f-display);font-weight:700;color:var(--muted)}
tr.top td:first-child{color:var(--ink)}
.tab{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}

:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
</style>

<script>

loading:['กำลังโหลดฐานข้อมูล…','Loading database…','データベースを読み込み中…'],

function pick(fixed,opt){

function score(A,B,ids,rank,Pm,Om,Wt,bonds,qs){

  if(ci===undefined){const [k,j]=loc(c1,s.id);c1[k][j]=id}
  else{const c2=L.courts[ci].match;const [k1,j1]=loc(c1,s.id),[k2,j2]=loc(c2,id);c1[k1][j1]=id;c2[k2][j2]=s.id}
  ui.sel=null;commitLive();
}
function billRows(L){
  const ids=Object.keys(L.sp).filter(id=>L.sp[id].att);const n=ids.length||1;
  const cc=courtCost(L),price=L.fee.shuttle||0,shT=L.history.reduce((s,h)=>s+(h.sh||0),0)*price;
  const totG=ids.reduce((s,id)=>s+L.sp[id].games,0),pay=L.fee.pay||'usage';
  return ids.map(id=>{const s=L.sp[id];let court=cc/n,sh=s.shu*price,total;
    if(pay==='equal'){sh=shT/n;total=court+sh}
    else if(pay==='games'){const f=totG?s.games/totG:1/n;court=cc*f;sh=shT*f;total=court+sh}
    else if(pay==='flat'){total=L.fee.flat||0}
    else total=court+sh;
    return {id,name:nm(id),games:s.games,wins:s.wins,losses:s.losses,court,sh,total:Math.ceil(total),paid:!!(L.paid&&L.paid[id])}});
}
function sessionStats(L){
  const games=L.history.length,sh=L.history.reduce((s,h)=>s+(h.sh||0),0);
  const cost=courtCost(L)+sh*(L.fee.shuttle||0);
  return {games,sh,spg:games?sh/games:0,cost,players:Object.values(L.sp).filter(s=>s.att).length};
}
function rankList(es){return es.filter(e=>e.games>0).sort((a,b)=>b.wins-a.wins||(b.wins/b.games)-(a.wins/a.games)||(b.pd||0)-(a.pd||0)||(b.dlv||0)-(a.dlv||0)||a.name.localeCompare(b.name))}
function liveRank(L){return rankList(Object.keys(L.sp).map(id=>{const s=L.sp[id],p=PL(id);return {id,name:nm(id),games:s.games,wins:s.wins,losses:s.losses,pd:(s.pf||0)-(s.pa||0),dlv:p&&s.lv0!=null?Math.round((p.lv-s.lv0)*100)/100:0}}))}
function allTimeRank(){const m={};
  Object.values(S.ledger).forEach(l=>(l.rank||[]).forEach((r,i)=>{const k=r.id||r.name;const o=m[k]||(m[k]={id:r.id,name:r.name,g:0,s:0,b:0,games:0,wins:0,losses:0,sess:0});
    if(i===0)o.g++;else if(i===1)o.s++;else if(i===2)o.b++;o.games+=r.games;o.wins+=r.wins;o.losses+=r.losses;o.sess++;if(PL(r.id))o.name=PL(r.id).name}));
  return Object.values(m).sort((a,b)=>b.g-a.g||b.s-a.s||b.b-a.b||b.wins-a.wins||(b.wins/(b.games||1))-(a.wins/(a.games||1)))}
function endSession(){

  S.ledger[id]={date:L.startedAt,end:now(),courts:L.courts.length,players:st.players,games:st.games,shuttles:st.sh,spg:Math.round(st.spg*100)/100,
    fee:{court:Math.round(courtCost(L)),shuttle:L.fee.shuttle||0,pay:L.fee.pay||'usage',flat:L.fee.flat||0,mode:L.fee.mode||'total',rate:L.fee.rate||0,hours:L.fee.hours||0},cur:L.cur,cost:Math.round(st.cost),collected:rows.reduce((s,r)=>s+r.total,0),
    per:rows.map(r=>({id:r.id,name:r.name,games:r.games,amt:r.total,paid:r.paid})),rank:liveRank(L)};

}

function assessLevel(ans){if(!ans||ans.some(a=>a<0))return null;const s=ans.reduce((a,b)=>a+b,0);
  return s<=1?1:s<=4?2:s<=7?3:s<=9?4:s<=11?5:s<=13?6:7}
function savePlayer(){
  const f=ui.form,name=(document.getElementById('pname')||{}).value||f.name;
  if(!name.trim()){toast(t('nameNeeded'));return}
  const lv=f.lv||assessLevel(f.ans)||3;
  if(f.id&&PL(f.id)){const p=PL(f.id);const changed=p.selfLv!==lv;p.name=name.trim();p.g=f.g;p.ans=f.ans;if(changed){p.lv=lv;p.selfLv=lv}commitPlayer(f.id)}
  else{const id=uid();S.players[id]={name:name.trim(),g:f.g,lv,selfLv:lv,ans:f.ans,games:0,wins:0,losses:0,created:now(),upd:now()};commitPlayer(id);if(ui.pick)ui.pick.add(id);
    if(S.live){if(isAdmin){S.live.sp[id]={status:'in',games:0,wins:0,losses:0,lastEnd:now(),shu:0,att:true,lv0:lv};commitLive()}else inboxAdd('checkin',id)}}
  toast(t('added',{n:name.trim()}));ui.form=null;if(ui.pick&&!f.id){}
}
function parseLine(line){
  const tk=line.trim().split(/\s+/).filter(Boolean);if(!tk.length)return null;let lv=3,g='';
  for(let n=0;n<2&&tk.length>1;n++){const x=tk[tk.length-1],up=x.toUpperCase();
    if(LV1.some(s=>s.toUpperCase()===up)){lv=1;tk.pop();continue}
    const i=LVS.findIndex((s,j)=>j>1&&s===up);if(i>1){lv=i;tk.pop();continue}
    if(/^(ช|ชาย|m|男|男性)$/i.test(x)){g='M';tk.pop();continue}
    if(/^(ญ|หญิง|f|女|女性)$/i.test(x)){g='F';tk.pop();continue}break}
  return {name:tk.join(' '),lv,g};
}
function setStatus(id,st,noCommit){const L=S.live;if(!L)return;
  if(!L.sp[id])L.sp[id]={status:st,games:0,wins:0,losses:0,lastEnd:now(),shu:0,att:st==='in',lv0:PL(id)?PL(id).lv:null};
  else{const s=L.sp[id];if(st==='in'&&s.status!=='in'&&s.games===0)s.lastEnd=now();s.status=st;if(st==='in')s.att=true}
  if(!noCommit)commitLive()}

function stockInfo(){
  const buys=Object.values(S.stock);const bought=buys.reduce((s,b)=>s+b.tubes*b.per,0),spent=buys.reduce((s,b)=>s+b.tubes*b.price,0);
  const used=Object.values(S.ledger).reduce((s,l)=>s+(l.shuttles||0),0)+(S.live?sessionStats(S.live).sh:0);
  return {bought,used,left:bought-used,avg:bought?spent/bought:0,has:buys.length>0};
}
async function saveFile(filename,data){

    const b=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(t('saveDone'))}catch(e){toast(t('saveFail'))}}

  const lmap={lrate:'rate',lhours:'hours',lflat:'flat'};if(lmap[c]){S.live.fee[lmap[c]]=v;commitLive();render();return}

  else if(c==='lfee'){S.live.fee.court=v;commitLive()}

  else if(c==='lvset'){const p=PL(el.dataset.id);p.lv=+el.value;commitPlayer(el.dataset.id)}
  render();
}

function qrCard(){return `<section class="card center"><h2>${t('qrTitle')}</h2>${qrHTML(joinUrl(),190)}<div class="row" style="justify-content:center"><button class="btn sm ghost" data-a="copylink">${t('copyLink')}</button></div><p class="hint" style="margin:0;text-align:left">${t('qrNote')}</p><button class="btn pri" data-a="tab" data-id="join">${t('openJoin')}</button></section>`}
function vJoin(){

function vStat(id){const p=PL(id);if(!p){ui.stat=null;return ''}

  const g=p.games||0,w=p.wins||0,l=p.losses||0,pd=(p.pf||0)-(p.pa||0);

  ${ix>=0?`<div class="hint">${t('allRankPos',{r:ix+1,n:all.length})}</div>`:''}

  </section>`}
async function makeRecap(){
  const {list,date,live}=todayList();if(!list.length)return;
  const last=Object.values(S.ledger).sort((a,b)=>b.date-a.date)[0];
  const st=live?sessionStats(S.live):{players:last.players,games:last.games,sh:last.shuttles,spg:last.spg};
  try{await Promise.all(['700 60px "Chakra Petch"','600 40px "IBM Plex Sans Thai"','600 40px "IBM Plex Sans JP"'].map(f=>document.fonts.load(f)))}catch(e){}
  const Wd=1080,Ht=1350,c=document.createElement('canvas');c.width=Wd;c.height=Ht;const x=c.getContext('2d');
  const FF='"Chakra Petch","IBM Plex Sans Thai","IBM Plex Sans JP",sans-serif';
  x.fillStyle='#1E5741';x.fillRect(0,0,Wd,Ht);x.fillStyle='#256348';x.fillRect(70,70,Wd-140,Ht-140);
  x.strokeStyle='rgba(243,247,244,.35)';x.lineWidth=5;x.strokeRect(70,70,Wd-140,Ht-140);x.strokeRect(120,70,Wd-240,Ht-140);
  x.setLineDash([14,12]);x.beginPath();x.moveTo(70,Ht/2+40);x.lineTo(Wd-70,Ht/2+40);x.stroke();x.setLineDash([]);
  const fit=(s,w,sz,wt)=>{let f=sz;x.font=`${wt} ${f}px ${FF}`;while(x.measureText(s).width>w&&f>18){f-=2;x.font=`${wt} ${f}px ${FF}`}return s};
  x.textAlign='center';x.fillStyle='#F3F7F4';x.font=`700 34px ${FF}`;x.fillText(t('brand').toUpperCase(),Wd/2,150);
  x.font=`700 68px ${FF}`;fit(t('recapTitle'),860,68,700);x.fillText(t('recapTitle'),Wd/2,235);
  x.font=`500 34px ${FF}`;x.globalAlpha=.85;x.fillText(new Date(date).toLocaleDateString(LOC[lang],{weekday:'long',year:'numeric',month:'long',day:'numeric'}),Wd/2,290);x.globalAlpha=1;
  const cols=[['#B9C2C7',2,370,220],['#E2B33C',1,540,300],['#C98049',3,710,180]],base=760;
  cols.forEach(([col,n,cx,hgt])=>{const r=list[n-1];if(!r)return;const w=160,top=base-hgt;
    x.fillStyle=col;x.fillRect(cx-w/2,top,w,hgt);x.fillStyle='#ffffff';x.font=`700 64px ${FF}`;x.fillText(String(n),cx,top+80);
    x.beginPath();x.arc(cx,top-130,34,0,7);x.fillStyle=col;x.fill();x.lineWidth=6;x.strokeStyle='rgba(255,255,255,.5)';x.stroke();
    x.fillStyle='#fff';x.font=`700 32px ${FF}`;x.fillText(String(n),cx,top-119);
    x.fillStyle='#F3F7F4';fit(r.name,200,38,700);x.fillText(r.name,cx,top-60);x.font=`500 26px ${FF}`;x.globalAlpha=.85;x.fillText(t('wl',{w:r.wins,l:r.losses}),cx,top-22);x.globalAlpha=1});
  const stats=[[t('c_players'),st.players],[t('c_games'),st.games],[t('c_sh'),st.sh],[t('c_spg'),fmt1(st.spg)]];
  stats.forEach(([k,v],i)=>{const cx=180+i*240;x.fillStyle='rgba(8,30,22,.35)';x.fillRect(cx-105,850,210,140);x.fillStyle='#F3F7F4';x.font=`700 56px ${FF}`;x.fillText(String(v),cx,930);x.font=`500 24px ${FF}`;x.globalAlpha=.8;x.fillText(k,cx,968);x.globalAlpha=1});
  x.textAlign='left';list.slice(3,11).forEach((r,i)=>{const col=i%2,row=Math.floor(i/2),px=150+col*420,py=1060+row*52;x.fillStyle='#F3F7F4';x.font=`700 28px ${FF}`;x.fillText((i+4)+'.',px,py);fit(r.name,240,28,500);x.fillText(r.name,px+56,py);x.font=`500 24px ${FF}`;x.globalAlpha=.75;x.textAlign='right';x.fillText(t('wl',{w:r.wins,l:r.losses}),px+380,py);x.textAlign='left';x.globalAlpha=1});
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));ui.recap={url:c.toDataURL('image/png'),blob,date};render();
}

  <button class="btn ghost" data-a="restore" ${ro?'disabled':''}>${t('restore')}</button>

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b)});

function readPayPay(f){if(!f||ro)return;const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{try{const sc=Math.min(1,1600/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
